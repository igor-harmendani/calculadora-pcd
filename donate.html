<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apoie com um Pix</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1c2430; --muted:#5b6675; --accent:#0a7d5a; --border:#dde3ea; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --text:#e8edf3; --muted:#9aa5b4; --accent:#2fc08f; --border:#2c3440; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
         background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px 24px; text-align:center; }
  h1 { font-size:1.35rem; margin:0 0 8px; }
  p { color:var(--muted); font-size:.95rem; line-height:1.5; margin:0 0 20px; }
  .qr { background:#fff; padding:12px; border-radius:12px; display:inline-block; border:1px solid var(--border); }
  .qr img { display:block; width:220px; height:220px; image-rendering:pixelated; }
  .label { font-size:.8rem; color:var(--muted); margin:22px 0 6px; text-align:left; }
  .code { width:100%; padding:10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.75rem; color:var(--text);
          background:var(--bg); border:1px solid var(--border); border-radius:8px; resize:none; height:92px; word-break:break-all; }
  button { margin-top:12px; width:100%; padding:13px; font-size:1rem; font-weight:600; color:#fff; background:var(--accent);
           border:0; border-radius:10px; cursor:pointer; }
  button:active { transform:scale(.98); }
  .ok { min-height:1.2em; margin-top:8px; font-size:.85rem; color:var(--accent); }
</style>
</head>
